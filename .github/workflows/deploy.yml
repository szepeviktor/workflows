name: Deploy repository to production (or primary) target.

on:
  workflow_call:
    inputs:
        include_composer_dependencies:
            description: "Setup composer dependencies"
            required: false
            type: boolean
            default: false
        php_version:
            description: "PHP version"
            required: false
            type: string
            default: "8.3"
    secrets:
      REMOTE_SSH_PRIVATE_KEY:
        required: true
      REMOTE_HOST:
        required: true
      REMOTE_USER:
        required: true
      REMOTE_PORT:
        required: true
      REMOTE_TARGET:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL:
        required: true
      PRODUCTION_URL:
        required: true
      DEPLOY_SOURCE:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v7

    - name: Setup PHP
      if: inputs.include_composer_dependencies == true
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        coverage: none
        tools: composer, cs2pr

    - name: Run composer build
      if: inputs.include_composer_dependencies == true
      run: |
        composer install --no-dev --no-progress
        composer dump-autoload

    - name: Verify deploy manifest exists
      run: |
        if [ ! -f ".deploy_manifest" ]; then
          echo "❌ .deploy_manifest file not found!"
          echo "Please provide a .deploy_manifest to specify which files should be deployed."
          exit 1
        fi
        echo "✅ .deploy_manifest file found"

    - name: Deploy to server
      if: success()
      uses: easingthemes/ssh-deploy@v5.1.1
      env:
          SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
          ARGS: '-rltzvOi --stats --delete --filter="merge .deploy_manifest"'
          SOURCE: ${{ secrets.DEPLOY_SOURCE || './' }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

    - name: Successful deployment Slack notification
      if: success()
      uses: wearerequired/slack-messaging-action@v3
      with:
        bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: ${{ secrets.SLACK_CHANNEL }}
        payload: >-
          {
            "icon_emoji": ":shipit:",
            "unfurl_links": false,
            "unfurl_media": false,
            "username": "Happy Prime Deployment: ${{ github.event.sender.login }}",
            "text": ":white_check_mark: Deployment from the <https://github.com/${{ github.repository }}|${{ github.repository }}> `${{ github.ref_name }}` branch to ${{ secrets.PRODUCTION_URL }} complete."
          }

    - name: Deployment failed Slack notification
      if: failure()
      uses: wearerequired/slack-messaging-action@v3
      with:
        bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: ${{ secrets.SLACK_CHANNEL }}
        payload: >-
          {
            "icon_emoji": ":shipit:",
            "unfurl_links": false,
            "unfurl_media": false,
            "username": "Happy Prime Deployment: ${{ github.event.sender.login }}",
            "text": ":large_red_square: Deployment from the <https://github.com/${{ github.repository }}|${{ github.repository }}> `${{ github.ref_name }}` branch to ${{ secrets.PRODUCTION_URL }} failed."
          }
