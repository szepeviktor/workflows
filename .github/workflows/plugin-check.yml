name: WP.org Plugin Check

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        description: 'PHP version to use'
        required: false
        default: '8.3'
      node-version:
        type: number
        description: 'Node version to use when building front-end assets'
        required: false
        default: 24
      include_composer_dependencies:
        type: boolean
        description: 'Install Composer dependencies when a composer.json is present'
        required: false
        default: true
      categories:
        type: string
        description: 'Plugin Check categories to run'
        required: false
        default: 'plugin_repo'
      error-severity:
        type: number
        description: 'Minimum severity to report as an error'
        required: false
        default: 7
      warning-severity:
        type: number
        description: 'Minimum severity to report as a warning'
        required: false
        default: 6

# The GITHUB_TOKEN used by Dependabot has read-only permissions by default, so
# we provide write permissions here so comments can be left on the pull request.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#changing-github_token-permissions
permissions:
  contents: read
  pull-requests: write

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Capture the plugin slug
        run: echo "PLUGIN_SLUG=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: wp-cli

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ format('{0}', inputs.node-version) }}
          cache: npm

      - name: Build front-end assets
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present

      - name: Install Composer dependencies
        if: ${{ inputs.include_composer_dependencies && hashFiles('composer.json') != '' }}
        env:
          GITHUB_TOKEN: ''
          COMPOSER_AUTH: ''
        run: composer install --no-dev --no-progress --optimize-autoloader

      - name: Install dist-archive-command
        env:
          GITHUB_TOKEN: ''
          COMPOSER_AUTH: ''
        run: |
          # setup-php writes the runner token into Composer's global auth.json,
          # and wp-cli's older bundled Composer rejects its format ("invalid
          # characters"). dist-archive-command is public, so remove the stored
          # token before installing.
          composer config --global --unset --auth github-oauth.github.com 2>/dev/null || true
          rm -f "$(composer -n config --global home 2>/dev/null)/auth.json" || true
          rm -f "$HOME/.composer/auth.json" "$HOME/.config/composer/auth.json" || true
          wp package install wp-cli/dist-archive-command:3.1.0

      - name: Build the distributable and extract it
        run: |
          wp dist-archive . "${{ runner.temp }}/${PLUGIN_SLUG}.zip" \
            --create-target-dir \
            --plugin-dirname="${PLUGIN_SLUG}"
          rm -rf "${{ runner.temp }}/plugin"
          mkdir -p "${{ runner.temp }}/plugin"
          unzip -q "${{ runner.temp }}/${PLUGIN_SLUG}.zip" -d "${{ runner.temp }}/plugin"

      - name: Write the Playground blueprint
        run: |
          cat > "${{ runner.temp }}/plugin/${PLUGIN_SLUG}/blueprint.json" <<JSON
          {
            "steps": [
              {"step": "installPlugin", "pluginData": {"resource": "wordpress.org/plugins", "slug": "plugin-check"}},
              {"step": "wp-cli", "command": "wp plugin activate plugin-check ${PLUGIN_SLUG}"},
              {"step": "cp",
                "fromPath": "/wordpress/wp-content/plugins/plugin-check/drop-ins/object-cache.copy.php",
                "toPath": "/wordpress/wp-content/object-cache.php"}
            ]
          }
          JSON

      - name: Run Plugin Check via WordPress Playground
        run: |
          cd "${{ runner.temp }}/plugin/${PLUGIN_SLUG}"
          npx --yes @wp-playground/cli php \
            --blueprint=blueprint.json \
            --mount=./:/wordpress/wp-content/plugins/${PLUGIN_SLUG} \
            --quiet \
            -- /tmp/wp-cli.phar plugin check ${PLUGIN_SLUG} \
              --categories=${{ inputs.categories }} \
              --format=json \
              --error-severity=${{ inputs.error-severity }} \
              --warning-severity=${{ inputs.warning-severity }} \
              --include-low-severity-errors \
            > "${{ runner.temp }}/plugin-check-result.json" || true
          echo "Plugin Check raw output:"
          cat "${{ runner.temp }}/plugin-check-result.json"

      - name: Report results on the pull request
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/plugin-check-result.json
          CATEGORIES: ${{ inputs.categories }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- plugin-check-playground -->';

            let raw = '';
            try {
              raw = fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim();
            } catch (e) {}

            // The Playground/WP-CLI output should be a JSON array; slice from
            // the first '[' to the last ']' in case of stray leading output.
            let issues = [];
            const start = raw.indexOf('[');
            const end = raw.lastIndexOf(']');
            if (start !== -1 && end !== -1) {
              try {
                issues = JSON.parse(raw.slice(start, end + 1));
              } catch (e) {
                core.warning(`Could not parse Plugin Check output: ${e.message}`);
              }
            }

            const errors = issues.filter(
              (i) => String(i.type).toUpperCase() === 'ERROR'
            );
            const warnings = issues.filter(
              (i) => String(i.type).toUpperCase() === 'WARNING'
            );

            let body;
            if (issues.length === 0) {
              body =
                `${marker}\n### ✅ Plugin Check passed\n\n` +
                `No errors or warnings from \`plugin check --categories=${process.env.CATEGORIES}\`.`;
            } else {
              const esc = (s) => String(s ?? '').replace(/\|/g, '\\|');
              const rows = issues
                .map(
                  (i) =>
                    `| ${esc(i.file)} | ${esc(i.line)}:${esc(i.column)} | ${esc(i.type)} | \`${esc(i.code)}\` | ${esc(i.message)} |`
                )
                .join('\n');
              body =
                `${marker}\n### Plugin Check: ${errors.length} error(s), ${warnings.length} warning(s)\n\n` +
                '| File | Line:Col | Type | Code | Message |\n' +
                '| --- | --- | --- | --- | --- |\n' +
                rows;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (issue_number) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number }
              );
              const existing = comments.find(
                (c) => c.body && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            }

            if (errors.length > 0) {
              core.setFailed(`Plugin Check reported ${errors.length} error(s).`);
            }
